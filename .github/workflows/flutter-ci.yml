name: Flutter validation and Android debug
on:
  push:
    branches: [main]
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: |
          if [ ! -d android ]; then
            echo "Android platform directory missing; debug build not yet available."
            exit 1
          fi
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: game-015-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
